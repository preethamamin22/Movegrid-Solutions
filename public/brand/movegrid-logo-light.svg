  <circle cx="28" cy="26" r="2.5" fill="#818CF8"/>
  <!-- Wordmark in white -->
  <text x="68" y="28" fill="#FFFFFF" font-family="'Inter',system-ui,sans-serif" font-weight="800" font-size="20" letter-spacing="0.2">MOVEGRID</text>
  <text x="69.5" y="44" fill="#94A3B8" font-family="'Inter',system-ui,sans-serif" font-weight="600" font-size="9.5" letter-spacing="3.8">SOLUTIONS</text>
